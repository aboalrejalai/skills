<style>
  /* هوية محمد أبوالرجال = الأخضر السعودي في brand/colors.css (لون الشعار وموقع aboalrejal.com) */
  :root {
    --sa-50: #F3FCF6;
    --sa-100: #DFF6E7;
    --sa-200: #B8EACB;
    --sa-400: #54C08A;
    --sa-500: #25935F;
    --sa-600: #1B8354;   /* الأخضر الأساسي = لون الشعار */
    --sa-700: #166A45;
    --sa-800: #14573A;
    --sa-900: #104631;
    --ink: #0D121C;
    --ink-2: #384250;
    --muted: #4D5761;
    --line: #E5E7EB;
    --paper: #ffffff;
    --head-h: 39mm;
    --foot-h: 38mm;
    --pad-x: 15mm;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #e7ebe9;
    color: var(--ink);
    font-family: "Kufam", "Geeza Pro", Tahoma, sans-serif;
    font-size: 10.5pt;
    line-height: 1.75;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }

  /* ---------- شريط الأدوات (شاشة فقط) ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--sa-900); color: #fff;
    font-size: 13px;
  }
  .toolbar button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 8px 18px; border: 0; border-radius: 8px;
    background: var(--sa-600); color: #fff;
  }
  .toolbar button:hover { background: var(--sa-500); }
  .toolbar span { opacity: .85; }

  /* ---------- الصفحة A4 ---------- */
  #pages { padding: 18px 0 40px; }
  .page {
    position: relative;
    width: 210mm; height: 297mm;
    margin: 0 auto 18px;
    background: var(--paper);
    box-shadow: 0 2px 14px rgba(0,0,0,.18);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* العلامة المائية: الشعار مائل وباهت خلف المحتوى */
  .watermark {
    position: absolute; left: 50%; top: 54%; width: 150mm;
    transform: translate(-50%, -50%) rotate(-30deg);
    opacity: .085; pointer-events: none; z-index: 0;
  }
  .lh-head, .body, .lh-foot { z-index: 1; }
  .body { position: relative; }
  .frame {
    position: absolute; inset: 4mm;
    border: .35mm solid var(--sa-600);
    border-radius: 2mm;
    pointer-events: none;
  }

  /* ---------- الترويسة ---------- */
  .lh-head { position: relative; flex: 0 0 var(--head-h); }
  .lh-band { position: absolute; top: 4mm; left: 4mm; right: 4mm; height: 29mm; border-radius: 2mm 2mm 0 0; overflow: hidden; }
  .lh-band svg { width: 100%; height: 100%; display: block; }
  /* العلامة كبيرة وخافتة خلف الترويسة */
  .lh-ghost { position: absolute; top: -9mm; left: 52mm; width: 52mm; opacity: .09; pointer-events: none; }
  .lh-teeth { position: absolute; top: 32.8mm; left: 4mm; right: 4mm; height: 3.2mm; }
  .lh-teeth svg { width: 100%; height: 100%; display: block; }
  .lh-grid {
    position: absolute; top: 4mm; left: 4mm; right: 4mm; height: 29mm;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10mm 0 9mm; color: #fff;
  }
  .lh-logo img { height: 16.5mm; width: auto; display: block; }
  .lh-logo .mark { font-size: 20pt; font-weight: 700; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 6mm; height: 5mm; border-radius: 1.4mm;
    background: var(--sa-600); color: #fff; flex: none;
  }
  .chip svg { width: 3.2mm; height: 3.2mm; }

  /* ---------- التذييل ---------- */
  .lh-foot { position: relative; flex: 0 0 var(--foot-h); padding: 0 4mm 4mm; font-size: 8.5pt; line-height: 1.5; }
  /* بيانات المالك في الصفحة الأخيرة فقط؛ بقية الصفحات شريط سفلي ورقم الصفحة */
  .page:not(.is-last) .lh-foot { flex-basis: 15mm; }
  .page:not(.is-last) .lh-foot-in { display: none; }
  .lh-foot-in {
    margin: 0 4mm; padding: 2.2mm 6mm 0;
    border-top: .6mm solid var(--sa-600);
    background: linear-gradient(to bottom, var(--sa-50), #fff 70%);
  }
  .foot-grid { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: .8mm 6mm; text-align: center; }
  .foot-grid div { justify-content: center; }
  .foot-grid div { display: flex; gap: 2mm; align-items: baseline; }
  .foot-grid .k { color: var(--muted); flex: none; }
  .foot-grid .v { font-weight: 600; }
  .foot-contact {
    display: flex; align-items: center; justify-content: center; gap: 7mm;
    margin-top: 1.8mm; padding-top: 1.6mm; border-top: .2mm solid var(--line);
    font-weight: 600;
  }
  .foot-contact > span { display: inline-flex; align-items: center; gap: 1.8mm; }
  /* صف الحسابات (LinkedIn، GitHub، X) تحت صف التواصل مباشرة */
  .foot-contact.social { margin-top: .9mm; padding-top: 0; border-top: 0; }
  .foot-bar { position: absolute; left: 4mm; right: 4mm; bottom: 4mm; height: 9mm; }
  .foot-bar svg { width: 100%; height: 100%; display: block; }
  .page-no {
    position: absolute; left: 0; right: 0; bottom: 5.2mm; text-align: center;
    color: #fff; font-size: 7.5pt; font-weight: 600;
  }
  /* ورقة رسمية فارغة ("blank": true): بلا شريط عنوان ولا رقم صفحة؛ تُطبع ويُكتب عليها */
  .page.blank .page-no { display: none; }
  /* صفوف إضافية في تذييل الصفحة الأخيرة ("footerRows" في ملف المستند)، مثل بيانات الحساب البنكي بطلب المالك */
  .page.has-extra { --foot-h: 50mm; }
  .foot-extra {
    display: flex; flex-wrap: wrap; justify-content: center; gap: .4mm 6mm;
    margin-top: 1.8mm; padding-top: 1.6mm; border-top: .2mm solid var(--line);
  }
  .foot-extra > span { display: inline-flex; gap: 2mm; align-items: baseline; white-space: nowrap; }
  .foot-extra .k { color: var(--muted); flex: none; }
  .foot-extra .v { font-weight: 600; }

  /* ---------- المحتوى ---------- */
  .body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 4mm var(--pad-x) 2mm; }
  .body > * { margin: 0 0 3mm; }
  [contenteditable]:focus { outline: 1px dashed var(--sa-600); outline-offset: 2px; }

  .doc-title { display: flex; align-items: stretch; border: .3mm solid var(--sa-600); border-radius: 2mm; overflow: hidden; }
  .doc-title h1 {
    margin: 0; flex: 1; display: flex; align-items: center; justify-content: center; gap: 3mm;
    padding: 2.2mm 5mm; color: #fff; text-align: center; line-height: 1.45;
    background: linear-gradient(45deg, var(--sa-900) 0%, var(--sa-700) 45%, var(--sa-600) 100%);
    font-size: 15pt; font-weight: 700;
  }
  .doc-title h1::before, .doc-title h1::after {
    content: ""; width: 2.4mm; height: 2.4mm; background: var(--sa-400); transform: rotate(45deg); flex: none;
  }
  .doc-title dl { margin: 0; display: flex; background: var(--sa-50); }
  .doc-title dl div { padding: 1.5mm 5mm; border-inline-start: .3mm solid var(--sa-200); text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .doc-title dt { font-size: 7.5pt; color: var(--muted); }
  .doc-title dd { margin: 0; font-weight: 700; font-size: 11pt; color: var(--sa-800); white-space: nowrap; }

  .parties { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 4mm; }
  .party { border: .3mm solid var(--line); border-top: 1mm solid var(--sa-600); border-radius: 2mm; padding: 2.5mm 3.5mm; }
  .party h3 { margin: 0 0 1mm; font-size: 8.5pt; color: var(--sa-600); font-weight: 700; }
  .party strong { display: block; font-size: 10.5pt; line-height: 1.5; margin-bottom: 1mm; }
  .party table { width: 100%; border-collapse: collapse; font-size: 9pt; }
  .party td { padding: .4mm 0; vertical-align: top; }
  .party td:first-child { color: var(--muted); width: 24mm; }
  .party small { display: block; margin-top: 1mm; color: var(--muted); font-size: 8pt; }

  h2.sec {
    display: flex; align-items: center; gap: 2.5mm;
    font-size: 11.5pt; font-weight: 700; color: var(--sa-700);
    line-height: 1.4; margin-top: 4.5mm;
  }
  h2.sec::before {
    content: ""; flex: none; width: 3.4mm; height: 3.4mm; transform: rotate(45deg);
    background: var(--sa-600); box-shadow: 1.2mm -1.2mm 0 -.4mm var(--sa-400);
  }
  h2.sec::after { content: ""; flex: 1; height: .3mm; background: linear-gradient(to left, var(--sa-200), transparent); }
  p.text { text-align: justify; }
  /* لا تبقى كلمة وحيدة في آخر سطر الفقرة أو الخانة */
  p.text, .note, .row > div, .blist li { text-wrap: pretty; }

  .row { display: flex; border: .25mm solid var(--line); border-top: 0; margin: 0 !important; break-inside: avoid; }
  .row > div { padding: 1.2mm 3mm; }
  .row > div + div { border-inline-start: .25mm solid var(--line); }
  .row.head {
    background: linear-gradient(to left, var(--sa-800), var(--sa-700));
    color: #fff; font-weight: 600; font-size: 9.5pt;
    border-color: var(--sa-800); border-top: .25mm solid var(--sa-800); border-radius: 1.5mm 1.5mm 0 0;
  }
  .row.head > div + div { border-color: rgba(255,255,255,.22); }

  .c-name { flex: 0 0 34mm; font-weight: 600; }
  .sub { list-style: none; margin: .8mm 0 0; padding: 0; }

  .kv { display: grid; grid-template-columns: 1fr 1fr; border: .3mm solid var(--line); border-radius: 2mm; overflow: hidden; }
  .kv div { display: flex; gap: 2.5mm; padding: 1.4mm 3.5mm; border-bottom: .25mm solid var(--line); }
  .kv div:nth-child(odd) { border-inline-end: .25mm solid var(--line); }
  .kv div.wide { grid-column: 1 / -1; border-inline-end: 0; }
  .kv div:nth-last-child(1), .kv div:nth-last-child(2):nth-child(odd):not(.wide) { border-bottom: 0; }
  .kv .k { color: var(--muted); flex: none; }
  .kv .v { font-weight: 600; }

  .addressee { border-inline-start: 1.2mm solid var(--sa-600); background: var(--sa-50); border-radius: 2mm; padding: 2.5mm 5mm; line-height: 1.9; }
  .addressee .to { font-weight: 700; font-size: 11pt; display: flex; justify-content: space-between; gap: 4mm; }
  .addressee .to span:last-child { color: var(--sa-700); }
  .addressee .greet { color: var(--ink-2); }
  .subject { display: flex; align-items: center; gap: 3mm; font-weight: 700; }
  .subject b { background: var(--sa-600); color: #fff; border-radius: 1.4mm; padding: .4mm 3mm; font-size: 9pt; }

  .totals { margin-inline-start: auto; width: 92mm; border: .3mm solid var(--sa-600); border-radius: 2mm; overflow: hidden; }
  .totals div { display: flex; justify-content: space-between; padding: 1.3mm 4mm; }
  .totals div + div { border-top: .25mm solid var(--line); }
  .totals .grand {
    background: linear-gradient(45deg, var(--sa-800), var(--sa-600));
    color: #fff; font-weight: 700; font-size: 11.5pt; border-top: 0;
  }
  .totals .words { background: var(--sa-50); color: var(--sa-800); font-size: 9pt; font-weight: 600; justify-content: center; text-align: center; }

  figure.plan { border: .3mm solid var(--line); border-radius: 2mm; padding: 3mm; text-align: center; }
  figure.plan img { max-width: 100%; max-height: 86mm; display: block; margin: 0 auto; }
  figure.plan figcaption { font-size: 8.5pt; color: var(--muted); margin-top: 1.5mm; }

  .note {
    background: var(--sa-50); border-radius: 2mm; padding: 2mm 4mm; font-weight: 600; color: var(--sa-900);
    border-inline-start: 1.2mm solid var(--sa-600);
  }

  .signs { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 4mm; margin-top: 5mm; }
  .sign { border: .3mm solid var(--line); border-top: 1mm solid var(--sa-600); border-radius: 2mm; padding: 3mm 4mm; }
  .sign h3 { margin: 0; font-size: 8.5pt; color: var(--sa-600); }
  .sign strong { display: block; min-height: 7mm; line-height: 1.5; }
  .sign em { display: block; font-style: normal; font-weight: 500; color: var(--muted); font-size: 8.5pt; }
  .sign .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(20mm, 1fr)); gap: 4mm; margin-top: 2mm; }
  .sign .slots span { position: relative; display: block; height: 19mm; border: .25mm dashed var(--sa-200); border-radius: 1.5mm; padding: 1mm 2mm; font-size: 8pt; color: var(--muted); }
  .sign .stamp {
    position: absolute; inset: 0; margin: auto; transform: rotate(-6deg);
    height: 19mm; width: auto; max-width: none; mix-blend-mode: multiply;
  }

  /* ---------- العرض الفني: غلاف، فهرس، بطاقات، نقاط القوة والتحسين، باقات، أرقام، مراحل ---------- */
  .page.cover { background: linear-gradient(150deg, var(--sa-900) 0%, var(--sa-700) 58%, var(--sa-600) 100%); color: #fff; }
  .cover-in { position: absolute; inset: 0; padding: 24mm 20mm 30mm; display: flex; flex-direction: column; }
  .cover .ghost { position: absolute; width: 165mm; left: -48mm; bottom: 26mm; opacity: .08; pointer-events: none; }
  .cover .logo img { height: 21mm; display: block; }
  .cover .kind { margin-top: 48mm; font-size: 13pt; font-weight: 600; color: var(--sa-200); display: flex; align-items: center; gap: 3mm; }
  .cover .kind::before { content: ""; width: 3mm; height: 3mm; background: var(--sa-400); transform: rotate(45deg); }
  .cover h1 { margin: 4mm 0 0; font-size: 31pt; font-weight: 800; line-height: 1.4; }
  .cover .sub { margin-top: 4mm; font-size: 13pt; line-height: 1.8; color: var(--sa-100); max-width: 150mm; }
  .cover .meta { margin: auto 0 0; display: flex; flex-wrap: wrap; gap: 3mm; }
  .cover .meta div { background: rgba(255,255,255,.1); border: .3mm solid rgba(255,255,255,.25); border-radius: 2mm; padding: 2mm 5mm; }
  .cover .meta dt { font-size: 8pt; color: var(--sa-200); }
  .cover .meta dd { margin: 0; font-weight: 700; font-size: 11pt; }
  .cover .conf { margin-top: 4mm; font-size: 8.5pt; color: var(--sa-200); }
  .cover .teeth-b { position: absolute; left: 0; right: 0; bottom: 0; }
  .cover .teeth-b svg { display: block; width: 100%; height: 6mm; }
  .cover .teeth-b div { height: 5mm; background: var(--sa-500); }

  .toc { border: .3mm solid var(--line); border-radius: 2mm; padding: 2mm 6mm; background: rgba(255,255,255,.7); }

  .toc-row span { font-weight: 600; }
  .toc-row i { flex: 1; }
  .toc-row b { color: var(--sa-600); min-width: 8mm; text-align: left; }

  .blist { list-style: none; margin: 0; padding: 0; }

  .blist li::before { content: ""; position: absolute; inset-inline-start: 0; top: 2.4mm; width: 1.8mm; height: 1.8mm; background: var(--sa-600); transform: rotate(45deg); }

  .cards { display: grid; grid-template-columns: repeat(var(--c, 2), 1fr); gap: 4mm; }

  @page { size: A4; margin: 0; }

  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zm1.782 13.019H3.555V9h3.564v11.452z"/></svg>',
  github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>',
};

const LOGO = LOGO_SRC
  ? `<img src="${LOGO_SRC}" alt="${PROFILE.nameAr}">`
  : `<span class="mark">${PROFILE.nameAr}</span>`;
const STAMP = STAMP_SRC ? `<img class="stamp" src="${STAMP_SRC}" alt="الختم">` : "";

/* شُرَف نجدية: مثلثات كأعالي جدران البيوت النجدية */
function teeth(w, h, up) {
  const n = Math.round(w / 6), s = w / n;
  let d = "";
  for (let i = 0; i < n; i++) {
    const x = i * s;
    d += up ? `M${x} ${h} L${x + s / 2} 0 L${x + s} ${h} Z ` : `M${x} 0 L${x + s / 2} ${h} L${x + s} 0 Z `;
  }
  return d;
}

/* الشريط الأخضر للترويسة: تدرج + نقش مثلثات خافت + شطفتان على الطرفين + خط سفلي فاتح */
const BAND = (() => {
  let tri = "";
  for (let y = 0; y < 30; y += 6)
    for (let x = (y / 6) % 2 ? -3 : 0; x < 204; x += 6)
      tri += `M${x} ${y + 6} L${x + 3} ${y} L${x + 6} ${y + 6} Z `;
  return `
<svg viewBox="0 0 202 29" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#104631"/><stop offset=".5" stop-color="#166A45"/><stop offset="1" stop-color="#1B8354"/>
    </linearGradient>
  </defs>
  <rect width="202" height="29" fill="url(#bg)"/>
  <path d="${tri}" fill="#fff" opacity=".045"/>
  <path d="M0 0 H14 L6 29 H0 Z" fill="#25935F" opacity=".7"/>
  <path d="M202 0 H188 L196 29 H202 Z" fill="#25935F" opacity=".7"/>
  <path d="M0 27.6 H202" stroke="#54C08A" stroke-width=".5" opacity=".9"/>
</svg>`;
})();

const TEETH = `
<svg viewBox="0 0 202 3.2" preserveAspectRatio="none" aria-hidden="true">
  <path d="${teeth(202, 3.2, false)}" fill="#14573A"/>
</svg>`;

const FOOTBAR = `
<svg viewBox="0 0 202 9" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="fb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B8354"/><stop offset=".5" stop-color="#104631"/><stop offset="1" stop-color="#1B8354"/>
    </linearGradient>
  </defs>
  <path d="${teeth(202, 2.6, true)}" fill="#25935F"/>
  <path d="M0 2.6 H202 V7 Q202 9 200 9 H2 Q0 9 0 7 Z" fill="url(#fb)"/>
  <path d="M0 2.6 H26 L20 9 H2 Q0 9 0 7 Z" fill="#54C08A" opacity=".55"/>
  <path d="M202 2.6 H176 L182 9 H200 Q202 9 202 7 Z" fill="#54C08A" opacity=".55"/>
</svg>`;

const headHTML = `
<header class="lh-head">
  <div class="lh-band">${BAND}${MARK_SRC ? `<img class="lh-ghost" src="${MARK_SRC}" alt="">` : ""}</div>
  <div class="lh-teeth">${TEETH}</div>
  <div class="lh-grid">
    <div class="lh-logo">${LOGO}</div>
  </div>
</header>`;

/* قيمة بلا حروف عربية (آيبان، رقم حساب، بريد) تُعرض من اليسار إلى اليمين */
const code = (s) => (/[\u0600-\u06FF]/.test(String(s)) ? esc(s) : num(s));
const FOOT_EXTRA = DOC.footerRows && DOC.footerRows.length
  ? `<div class="foot-extra">${DOC.footerRows.map(([k, v]) =>
      `<span><span class="k">${esc(String(k).replace(/[:：]\s*$/, ""))}:</span><span class="v">${code(v)}</span></span>`).join("")}</div>`
  : "";

const footHTML = `
<footer class="lh-foot">
  <div class="lh-foot-in">
    <div class="foot-grid">
      <div><span class="v">${PROFILE.nameAr}</span></div>
      <div><span class="k">${PROFILE.titleAr}</span></div>
      <div><span class="k">المدينة:</span><span class="v">${PROFILE.city}</span></div>
    </div>
    <div class="foot-contact">
      <span><span class="chip">${ICON.phone}</span>${num(PROFILE.phone)}</span>
      <span><span class="chip">${ICON.web}</span>${num(PROFILE.website)}</span>
      <span><span class="chip">${ICON.mail}</span>${num(PROFILE.email)}</span>
    </div>
    <div class="foot-contact social">
      ${PROFILE.social.map((s) => `<span title="${s.label}"><span class="chip">${ICON[s.icon]}</span>${num(s.value)}</span>`).join("")}
    </div>
    ${FOOT_EXTRA}
  </div>
  <div class="foot-bar">${FOOTBAR}</div>
  <div class="page-no"></div>
</footer>`;

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* الفقرة التي تسبق هذه الأقسام تنتقل معها إلى الصفحة التالية ولا تبقى وحدها */
const TABLE_LIKE = ["items", "payments", "table", "cards", "proscons", "plans", "stats", "timeline", "kv"];
const blist = (xs) => `<ul class="blist">${(xs || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
const chunk = (xs, n) => xs.reduce((r, x, i) => (i % n ? r[r.length - 1].push(x) : r.push([x]), r), []);
let group = 0;  /* يربط صفوف كل جدول برأسه لتكرار الرأس في الصفحة التالية */

const partiesHTML = (list) => `<div class="parties" style="--n:${Math.min(list.length, 3)}">${list.map((p) => `
  <div class="party"><h3>${esc(p.label)}</h3><strong>${esc(p.name)}</strong>
    <table>${(p.fields || []).map((f) => `<tr><td>${esc(f.label)}</td><td>${f.value ? val(f.value) : `<span class="todo">يُضاف</span>`}</td></tr>`).join("")}</table>
    ${p.note ? `<small>${esc(p.note)}</small>` : ""}</div>`).join("")}</div>`;

/* بند: نص، أو {text, sub: [...], after} لبند فيه فقرات (أ) (ب) وسطر ختامي */
const LETTERS = "أبجدهوزحطيكلمنسعفصقرشت";
const itemHTML = (t) => {
  if (typeof t === "string") return esc(t);
  const sub = (t.sub || []).map((s, i) => `<li><b>(${LETTERS[i]})</b><span>${esc(s)}</span></li>`).join("");
  return `${esc(t.text)}${sub ? `<ul class="sub">${sub}</ul>` : ""}${t.after ? `<div class="after">${esc(t.after)}</div>` : ""}`;
};

/* كل نوع قسم يُرجع «قطعاً» مستقلة؛ التوزيع على الصفحات يتم تلقائياً */
const SECTION = {
  heading: (s, next, i) => [`<h2 class="sec" data-keep data-h="${i}">${esc(s.text)}</h2>`],
  toc: () => [`<div class="toc">${DOC.sections.map((x, i) => x.type === "heading" && x.toc !== false
      ? `<div class="toc-row"><span>${esc(x.text)}</span><i></i><b class="num" data-toc-for="${i}"></b></div>` : "").join("")}</div>`],
  stats: (s) => [`<div class="stats" style="--c:${Math.min(s.items.length, 5)}">${s.items.map((x) =>
      `<div class="stat"><b class="num">${esc(x.value)}</b><span>${esc(x.label)}</span></div>`).join("")}</div>`],
  cards: (s) => chunk(s.cards, s.columns || 2).map((row) => `<div class="cards" style="--c:${s.columns || 2}">${row.map((c) =>
      `<div class="fcard"><h4>${esc(c.title)}</h4>${c.text ? `<p>${esc(c.text)}</p>` : ""}${c.items ? blist(c.items) : ""}</div>`).join("")}</div>`),
  proscons: (s) => [`<div class="pc">
      <div class="pros"><h4>${esc(s.prosLabel || "نقاط القوة")}</h4>${blist(s.pros)}</div>
      <div class="cons"><h4>${esc(s.consLabel || "نقاط التحسين")}</h4>${blist(s.cons)}</div></div>`],
  plans: (s) => [`<div class="plans" style="--c:${s.plans.length}">${s.plans.map((x) => `
      <div class="plan${x.highlight ? " hl" : ""}"><header><h4>${esc(x.name)}${x.tag ? `<span class="tag">${esc(x.tag)}</span>` : ""}</h4>
        <div class="price">${typeof x.price === "number" ? `<span class="num">${x.price.toLocaleString("en-US")}</span> <small>ريال</small>` : esc(x.price)}${x.period ? ` <small>/ ${esc(x.period)}</small>` : ""}</div>
        ${x.note ? `<div class="pnote">${esc(x.note)}</div>` : ""}</header>${blist(x.features)}</div>`).join("")}</div>`],
  timeline: (s) => s.phases.map((x, i) => `<div class="tl${i === s.phases.length - 1 ? " last" : ""}">
      <div class="tl-rail"><b><span class="num">${String(i + 1).padStart(2, "0")}</span></b><i></i></div>
      <div class="tl-body"><h4>${esc(x.name)}${x.duration ? `<em>${esc(x.duration)}</em>` : ""}</h4>${blist(x.items)}</div></div>`),
  paragraph: (s, next) => [`<p class="text"${next && TABLE_LIKE.includes(next.type) ? " data-keep" : ""}>${esc(s.text)}</p>`],
  note: (s) => [`<p class="note">${esc(s.text)}</p>`],
  parties: (s) => [partiesHTML(s.parties)],
  kv: (s) => [`<div class="kv">${s.rows.map(([k, v], i) =>
      `<div${s.rows.length % 2 && i === s.rows.length - 1 ? ' class="wide"' : ""}><span class="k">${esc(k)}</span><span class="v">${val(v)}</span></div>`).join("")}</div>`],
  addressee: (s) => [`<div class="addressee">
      <div class="to"><span>${esc(s.to)}</span><span>${esc(s.honorific || "المحترمين")}</span></div>
      ${s.greeting !== false ? `<div class="greet">${esc(s.greeting || "السلام عليكم ورحمة الله وبركاته، وبعد:")}</div>` : ""}
    </div>`, ...(s.subject ? [`<div class="subject"><b>الموضوع</b><span>${esc(s.subject)}</span></div>`] : [])],
  items: (s) => [
    `<div class="row head" data-keep data-head="${++group}"><div class="c-n">م</div><div class="c-grow">${esc(s.label || "البند")}</div></div>`,
    ...s.items.map((t, i) =>
      `<div class="row${i === s.items.length - 1 ? " last" : ""}" data-g="${group}"><div class="c-n num">${i + 1}</div><div class="c-grow">${itemHTML(t)}</div></div>`),
  ],
  totals: (s) => {
    const rate = s.vatRate ?? 0;  /* فرد غير مسجّل في ضريبة القيمة المضافة (PROFILE.md) */
    const total = s.totalInclVat ?? s.totalExclVat * (1 + rate);
    const net = s.totalExclVat ?? total / (1 + rate);
    if (!rate) return [`<div class="totals">
      <div class="grand"><span>الإجمالي</span><span>${money(total)}</span></div>
      ${s.words ? `<div class="words">${esc(s.words)}</div>` : ""}
    </div>`];
    return [`<div class="totals">
      <div><span>المبلغ قبل الضريبة</span><span>${money(net)}</span></div>
      <div><span>ضريبة القيمة المضافة (${num(Math.round(rate * 100) + "%")})</span><span>${money(total - net)}</span></div>
      <div class="grand"><span>الإجمالي شامل الضريبة</span><span>${money(total)}</span></div>
      ${s.words ? `<div class="words">${esc(s.words)}</div>` : ""}
    </div>`];
  },
  image: (s) => [`<figure class="plan"><img src="${s.src}" alt="${esc(s.caption)}">${s.caption ? `<figcaption>${esc(s.caption)}</figcaption>` : ""}</figure>`],
  payments: (s) => {
    const t = (DOC.sections.find((x) => x.type === "totals") || {});
    const total = s.total ?? t.totalInclVat ?? t.totalExclVat * (1 + (t.vatRate ?? 0));
    return [
      `<div class="row head" data-keep data-head="${++group}"><div class="c-n">م</div><div class="c-name">الدفعة</div><div class="c-pct">النسبة</div><div class="c-amt">المبلغ</div><div class="c-grow">موعد الاستحقاق</div></div>`,
      ...s.rows.map((p, i) =>
        `<div class="row${i === s.rows.length - 1 ? " last" : ""}" data-g="${group}"><div class="c-n num">${i + 1}</div><div class="c-name">${esc(p.name)}</div><div class="c-pct">${num(p.pct + "%")}</div><div class="c-amt">${money((total * p.pct) / 100)}</div><div class="c-grow">${esc(p.due)}</div></div>`),
    ];
  },
  table: (s) => {
    const cell = (c, v) => `<div class="${c.width ? "" : "c-grow"}" style="${c.width ? `flex:0 0 ${c.width}mm;` : ""}${c.align ? `text-align:${c.align};` : ""}">${v}</div>`;
    const n = s.numbered !== false;
    return [
      `<div class="row head" data-keep data-head="${++group}">${n ? '<div class="c-n">م</div>' : ""}${s.columns.map((c) => cell(c, esc(c.label))).join("")}</div>`,
      ...s.rows.map((r, i) =>
        `<div class="row${i === s.rows.length - 1 ? " last" : ""}" data-g="${group}">${n ? `<div class="c-n num">${i + 1}</div>` : ""}${s.columns.map((c, j) => cell(c, val(r[j]))).join("")}</div>`),
    ];
  },
};

function buildBlocks() {
  const b = [];
  const meta = [];
  if (DOC.number || DOC.numberLabel)
    meta.push(`<div><dt>${esc(DOC.numberLabel || "رقم المستند")}</dt><dd>${blank(DOC.number, "____")}</dd></div>`);
  meta.push(`<div><dt>التاريخ</dt><dd>${blank(DOC.date, "__ / __ / ____")}</dd></div>`);
  if (!DOC.cover && !DOC.blank) b.push(`<div class="doc-title"><h1>${esc(DOC.title)}</h1><dl>${meta.join("")}</dl></div>`);

  if (DOC.parties && DOC.parties.length) b.push(partiesHTML(DOC.parties));

  DOC.sections.forEach((s, i) => b.push(...SECTION[s.type](s, DOC.sections[i + 1], i)));

  if (DOC.signatures && DOC.signatures.length)
    b.push(`<div class="signs" style="--n:${Math.min(Math.max(DOC.signatures.length, 2), 3)}">${DOC.signatures.map((g) => `
      <div class="sign"><h3>${esc(g.label)}</h3><strong>${esc(g.name)}${g.role ? `<em>${esc(g.role)}</em>` : ""}</strong>
        <div class="slots"><span>التوقيع</span>${g.seal === false ? "" : `<span>الختم${g.stamp ? STAMP : ""}</span>`}</div></div>`).join("")}</div>`);

  return b.map((html) => {
    const node = el(html);
    if (!node.matches("figure")) { node.contentEditable = "true"; node.spellcheck = false; }
    return node;
  });
}

const pagesEl = document.getElementById("pages");
const blocks = buildBlocks();

function newPage() {
  const wm = WATERMARK_SRC && DOC.watermark !== false ? `<img class="watermark" src="${WATERMARK_SRC}" alt="">` : "";
  const cls = ["page", DOC.blank ? "blank" : "", FOOT_EXTRA ? "has-extra" : ""].filter(Boolean).join(" ");
  const page = el(`<section class="${cls}"><div class="frame"></div>${wm}${headHTML}<main class="body"></main>${footHTML}</section>`);
  pagesEl.appendChild(page);
  return page.querySelector(".body");
}

function coverPage() {
  const c = DOC.cover;
  const meta = [[c.toLabel || "مقدَّم إلى", c.to], [DOC.numberLabel || "رقم المستند", DOC.number], ["التاريخ", DOC.date]]
    .filter(([, v]) => v !== undefined)
    .map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v ? val(v) : '<span class="todo">يُضاف</span>'}</dd></div>`).join("");
  return el(`<section class="page cover">${MARK_SRC ? `<img class="ghost" src="${MARK_SRC}" alt="">` : ""}
    <div class="cover-in">
      <div class="logo">${LOGO}</div>
      <div class="kind">${esc(c.kind || DOC.title)}</div>
      <h1>${esc(c.title || DOC.title)}</h1>
      ${c.subtitle ? `<div class="sub">${esc(c.subtitle)}</div>` : ""}
      <dl class="meta">${meta}</dl>
      ${c.confidential !== false ? `<div class="conf">${esc(c.confidential || "وثيقة سرية مقدَّمة للجهة المذكورة لأغراض التقييم فقط.")}</div>` : ""}
    </div>
    <div class="teeth-b"><svg viewBox="0 0 210 6" preserveAspectRatio="none"><path d="${teeth(210, 6, true)}" fill="#25935F"/></svg><div></div></div>
  </section>`);
}

function fillToc() {
  const pages = [...pagesEl.querySelectorAll(".page:not(.cover)")];
  pagesEl.querySelectorAll("[data-toc-for]").forEach((b) => {
    const h = pagesEl.querySelector(`[data-h="${b.dataset.tocFor}"]`);
    const n = h ? pages.indexOf(h.closest(".page")) + 1 : 0;
    b.textContent = n || "";
  });
}

function repeatHead(body) {
  const first = body.firstElementChild;
  if (!first || !first.dataset.g) return;
  const head = blocks.find((n) => n.dataset.head === first.dataset.g).cloneNode(true);
  head.removeAttribute("data-keep");
  body.insertBefore(head, first);
}

function paginate() {
  blocks.forEach((n) => n.remove());
  pagesEl.innerHTML = "";
  if (DOC.cover) pagesEl.appendChild(coverPage());
  let body = newPage();
  for (const node of blocks) {
    body.appendChild(node);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) {
      // انقل القطعة للصفحة التالية، ومعها العناوين التي يجب أن تلازمها
      const moving = [node];
      let prev = node.previousElementSibling;
      while (prev && prev.hasAttribute("data-keep") && prev.previousElementSibling) {
        moving.unshift(prev);
        prev = prev.previousElementSibling;
      }
      body = newPage();
      moving.forEach((n) => body.appendChild(n));
      repeatHead(body);
    }
  }
  // التذييل الكامل في الصفحة الأخيرة فقط؛ إن لم يتسع له المكان تُنقل آخر قطعة إلى صفحة جديدة
  const last = pagesEl.lastElementChild;
  last.classList.add("is-last");
  if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) {
    last.classList.remove("is-last");
    const moving = [body.lastElementChild];
    let prev = moving[0].previousElementSibling;
    while (prev && prev.hasAttribute("data-keep") && prev.previousElementSibling) {
      moving.unshift(prev);
      prev = prev.previousElementSibling;
    }
    body = newPage();
    moving.forEach((n) => body.appendChild(n));
    repeatHead(body);
    pagesEl.lastElementChild.classList.add("is-last");
  }
  const all = pagesEl.querySelectorAll(".page-no");
  all.forEach((n, i) => (n.innerHTML = `صفحة ${num(i + 1)} من ${num(all.length)}`));
  fillToc();
}

paginate();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(paginate);
window.addEventListener("load", paginate);
pagesEl.addEventListener("focusout", () => setTimeout(() => {
  if (!pagesEl.contains(document.activeElement) || !document.activeElement.isContentEditable) paginate();
}, 0));
</script>
</body>
</html>
