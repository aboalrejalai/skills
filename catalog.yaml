local:
  # ─── planning-workflow: the kickoff line ────────────────────────
  - name: kickoff-plan
    category: planning-workflow
    tags: [made, use, favorite]
    note: { ar: "طريقتي في التخطيط وأول محطة في خط kickoff: مهام صغيرة لكل منها فحص يشغّله الوكيل.", en: "My planning method and the first kickoff station: atomic tasks, each with a check the agent runs." }
  - name: kickoff-implement
    category: planning-workflow
    tags: [made, use, favorite]
    note: { ar: "ينفذ ملف الخطة مهمة مهمة على فرع مستقل ويسجل دليل كل فحص.", en: "Executes the plan task by task on a branch and logs each check's evidence." }
